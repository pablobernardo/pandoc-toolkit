version: 1
project: {name: conformance, base_dir: .}
document: {title: Conformance, author: Ignored when metadata is set}
input:
  chapters_dir: chapters
  glob: '*.md'
  order: natural
  explicit_files: []
output:
  dir: output
  file_prefix: report
  suffix: recorded
  keep_merged_markdown: false
pandoc:
  pdf_engine: lualatex
  toc: true
  toc_depth: 3
  number_sections: true
  metadata_file: assets/metadata.yaml
  resource_path: [chapters]
filters:
  emoji: {enabled: false, emoji_dir: output/emoji, include_ballot_icons: false}
  mermaid: {enabled: false, output_dir: output/mermaid, background: transparent}
  extra_lua_filters: []
runtime: {required_commands: [], strict: false}
compat: {legacy_clearpage_between_h1: true}
