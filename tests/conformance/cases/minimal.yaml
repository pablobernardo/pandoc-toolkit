version: 1
project: {name: conformance, base_dir: .}
document: {title: Conformance}
input:
  chapters_dir: chapters
  glob: '*.md'
  order: natural
  explicit_files: []
output:
  dir: output
  file_prefix: report
  suffix: recorded
  keep_merged_markdown: true
pandoc:
  pdf_engine: xelatex
  toc: false
  toc_depth: 2
  number_sections: false
  metadata_file: ''
  resource_path: [chapters]
filters:
  emoji: {enabled: false, emoji_dir: output/emoji, include_ballot_icons: true}
  mermaid: {enabled: false, output_dir: output/mermaid, background: transparent}
  extra_lua_filters: []
runtime: {required_commands: [], strict: false}
compat: {legacy_clearpage_between_h1: false}
