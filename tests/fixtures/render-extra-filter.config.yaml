version: 1

project:
  name: render-advanced-project
  base_dir: .

document:
  title: "Render Advanced"

input:
  chapters_dir: "chapters"
  glob: "*.md"
  order: natural
  explicit_files:
    - "01-intro.md"

output:
  dir: "dist/pdf"
  file_prefix: "advanced"
  suffix: "${date:YYYYMMDD}"
  keep_merged_markdown: true

pandoc:
  pdf_engine: xelatex
  toc: true
  toc_depth: 2
  number_sections: true
  template: "templates/default.tex"
  metadata_file: ""
  resource_path:
    - "chapters"
    - "assets/media"

filters:
  emoji:
    enabled: true
    emoji_dir: "dist/assets/emoji"
    include_ballot_icons: true
  mermaid:
    enabled: true
    output_dir: "dist/assets/mermaid"
    background: "white"
  extra_lua_filters:
    - "filters/custom.lua"

runtime:
  required_commands:
    - pandoc
  strict: true

compat:
  legacy_clearpage_between_h1: false
