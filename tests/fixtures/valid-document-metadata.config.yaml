version: 1

project:
  name: test-project
  base_dir: .

document:
  title: "Test Document"
  language: "en"
  titlepage: false
  metadata:
    keywords: "compliance, operations"
    subject: "Quarterly report"

input:
  chapters_dir: "chapters"
  glob: "*.md"
  order: natural
  explicit_files: []

output:
  dir: "output"
  file_prefix: "report"
  suffix: "${date:YYYYMMDD}"
  keep_merged_markdown: true

pandoc:
  pdf_engine: xelatex
  toc: true
  toc_depth: 2
  number_sections: true
  template: "templates/default.tex"
  resource_path:
    - "chapters"

filters:
  emoji:
    enabled: true
    emoji_dir: "output/emoji"
    include_ballot_icons: true
  mermaid:
    enabled: true
    output_dir: "output/mermaid"
    background: "transparent"
  extra_lua_filters: []

runtime:
  required_commands:
    - pandoc
  strict: true

compat:
  legacy_clearpage_between_h1: true
