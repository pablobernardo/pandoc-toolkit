# Generated by scripts/tools/bookkit/build.py. Do not edit:
# change the volume's manifest.yaml (and series.yaml) instead.
version: 1

project:
  name: "a-field-guide-to-imaginary-weather"
  base_dir: "../../../examples/book-kit/single"

document:
  title: "A Field Guide to Imaginary Weather"
  subtitle: "Three short chapters on weather that does not exist"
  author: "The Example Maintainers"
  publisher: "Example Editions"
  date: "2026"
  rights: "CC0 1.0 Universal - public domain dedication"
  language: "en"
  titlepage: true
  metadata:
    collection: "Imaginary Field Guides"
    isbn: "978-0-000000-01-8"
    audience: "Curious readers of impossible weather"

input:
  chapters_dir: "."
  glob: "*.md"
  order: natural
  explicit_files:
    - "content/front-matter/00-note.md"
    - "../../../.output/bookkit/single/generated/00-mainmatter.md"
    - "content/chapters/01-clouds.md"
    - "content/chapters/02-fog.md"
    - "content/chapters/03-rain.md"
    - "../../../.output/bookkit/single/generated/01-appendix.md"
    - "content/back-matter/01-glossary.md"
    - "content/back-matter/02-about-this-guide.md"

output:
  formats: [pdf]
  dir: "../../../.output/bookkit/single"
  file_prefix: "a-field-guide-to-imaginary-weather"
  suffix: "${date:YYYYMMDD}"
  keep_merged_markdown: false

pandoc:
  pdf_engine: xelatex
  toc: true
  toc_depth: 2
  number_sections: true
  template: "../../book/templates/book.tex"
  resource_path:
    - "content"

filters:
  emoji:
    enabled: false
  mermaid:
    enabled: false
  extra_lua_filters: []

runtime:
  required_commands:
    - pandoc
    - xelatex
    - python3
  strict: true
