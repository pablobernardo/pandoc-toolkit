name: Security

permissions:
  contents: read
  actions: read
  security-events: write

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1"

jobs:
  security-scans:
    name: Security scans (SAST + secrets)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pinned image instead of `pip install semgrep`: the pip path breaks on
      # every runner bump (Python 3.14 has no pydantic-core wheel, and
      # setuptools 81+ dropped the pkg_resources that semgrep's opentelemetry
      # dependency imports). The container is immutable and matches how the
      # Gitleaks step below already runs.
      - name: Run Semgrep (SAST)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "${PWD}:/src" \
            semgrep/semgrep:1.86.0 \
            semgrep --config p/security-audit --sarif --output=/src/semgrep.sarif --quiet /src

      - name: Run Gitleaks (secrets)
        run: |
          docker run --rm -v "${PWD}:/repo" ghcr.io/gitleaks/gitleaks:v8.24.2 \
            detect --source=/repo --no-git --redact --exit-code 0 --report-format sarif --report-path /repo/gitleaks.sarif

      - name: Upload Semgrep SARIF
        if: ${{ always() && vars.ENABLE_SARIF_UPLOAD == 'true' && github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == 'main') }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Upload Gitleaks SARIF
        if: ${{ always() && vars.ENABLE_SARIF_UPLOAD == 'true' && github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == 'main') }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      - name: Enforce security severity thresholds
        env:
          SEMGREP_ERROR_THRESHOLD: "0"
          SEMGREP_WARNING_THRESHOLD: "0"
          GITLEAKS_ERROR_THRESHOLD: "0"
          GITLEAKS_WARNING_THRESHOLD: "0"
        run: |
          python3 scripts/enforce-security-thresholds.py semgrep.sarif semgrep
          python3 scripts/enforce-security-thresholds.py gitleaks.sarif gitleaks
