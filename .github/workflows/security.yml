name: Security

permissions:
  contents: read
  actions: read
  security-events: write

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1"

jobs:
  security-scans:
    name: Security scans (SAST + secrets)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep (SAST)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install semgrep==1.86.0
          semgrep --config p/security-audit --sarif --output semgrep.sarif --quiet .

      - name: Run Gitleaks (secrets)
        run: |
          docker run --rm -v "${PWD}:/repo" ghcr.io/gitleaks/gitleaks:v8.24.2 \
            detect --source=/repo --no-git --redact --exit-code 0 --report-format sarif --report-path /repo/gitleaks.sarif

      - name: Upload Semgrep SARIF
        if: ${{ always() && github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == 'main') }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Upload Gitleaks SARIF
        if: ${{ always() && github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == 'main') }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      - name: Enforce security severity thresholds
        env:
          SEMGREP_ERROR_THRESHOLD: "0"
          SEMGREP_WARNING_THRESHOLD: "0"
          GITLEAKS_ERROR_THRESHOLD: "0"
          GITLEAKS_WARNING_THRESHOLD: "0"
        run: |
          python3 scripts/enforce-security-thresholds.py semgrep.sarif semgrep
          python3 scripts/enforce-security-thresholds.py gitleaks.sarif gitleaks
