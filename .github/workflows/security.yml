name: Security

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1"

jobs:
  security-scans:
    name: Security scans (SAST + secrets)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep (SAST)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install semgrep==1.86.0
          semgrep --config p/security-audit --error --quiet .

      - name: Run Gitleaks (secrets)
        run: |
          docker run --rm -v "${PWD}:/repo" ghcr.io/gitleaks/gitleaks:v8.24.2 \
            detect --source=/repo --no-git --redact --exit-code 1
