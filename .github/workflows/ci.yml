name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_render_integration:
        description: "Run L2 semi-real render integration job (Ubuntu)"
        required: false
        default: false
        type: boolean
      run_render_full:
        description: "Run L3 full integration job (Ubuntu, with Mermaid CLI)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 3 * * 1"

jobs:
  l1-tests:
    name: L1 tests (${{ matrix.os }})
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Ensure scripts are executable
        run: |
          chmod +x bin/pandoc-pdf
          chmod +x tests/run.sh
          chmod +x scripts/validate-config.py
          chmod +x scripts/render-native.py
          chmod +x scripts/prepare-emojis.py
          chmod +x scripts/preflight.sh
          chmod +x scripts/preflight.py

      - name: Run L1 CLI test suite
        run: tests/run.sh

  l2-render-integration:
    name: L2 render integration (ubuntu, optional)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_render_integration == true }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-latex-base

      - name: Ensure scripts are executable
        run: |
          chmod +x bin/pandoc-pdf
          chmod +x scripts/validate-config.py
          chmod +x scripts/render-native.py
          chmod +x scripts/prepare-emojis.py
          chmod +x scripts/preflight.sh
          chmod +x scripts/preflight.py
          chmod +x tests/l2-local.sh

      - name: Run L2 local integration runner
        run: |
          bash tests/l2-local.sh

  l3-render-full:
    name: L3 full integration (ubuntu, scheduled/manual)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_render_full == true) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install full runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-latex-base texlive-xetex nodejs npm chromium-browser
          # Keep in sync with MERMAID_CLI_VERSION and docs/dependency-policy.md
          sudo npm install -g @mermaid-js/mermaid-cli@10.9.1

      - name: Ensure scripts are executable
        run: |
          chmod +x bin/pandoc-pdf
          chmod +x scripts/validate-config.py
          chmod +x scripts/render-native.py
          chmod +x scripts/prepare-emojis.py
          chmod +x scripts/preflight.sh
          chmod +x scripts/preflight.py
          chmod +x tests/l3-local.sh

      - name: Run L3 local integration runner
        run: |
          PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser bash tests/l3-local.sh
