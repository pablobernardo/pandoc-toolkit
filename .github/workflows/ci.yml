name: CI

permissions:
  contents: read

# A pull request that is pushed twice leaves two runs competing for the same
# runners, and the scarce ones are macOS. Superseded pull-request runs are
# cancelled; a run on main is never cancelled, because it is the record.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_l1_macos:
        description: "Run L1 on macOS (weekly otherwise; release evidence)"
        required: false
        default: false
        type: boolean
      run_render_integration:
        description: "Run L2 semi-real render integration job (Ubuntu)"
        required: false
        default: false
        type: boolean
      run_render_full:
        description: "Run L3 full integration job (Ubuntu, with Mermaid CLI)"
        required: false
        default: false
        type: boolean
      run_epub_acceptance:
        description: "Run EPUB acceptance: EPUBCheck over the shipped examples"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 3 * * 1"

jobs:
  l1-tests:
    name: L1 tests (ubuntu-latest)
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # No job here pushes, so the token does not need to survive the
          # checkout in the local git config.
          persist-credentials: false

      - name: Ensure scripts are executable
        run: |
          chmod +x bin/pandoc-pdf
          chmod +x tests/run.sh
          chmod +x scripts/runtime/validate-config.py
          chmod +x scripts/runtime/render-native.py
          chmod +x scripts/runtime/prepare-emojis.py
          chmod +x scripts/runtime/preflight.sh
          chmod +x scripts/runtime/preflight.py

      - name: Run L1 CLI test suite
        run: tests/run.sh

  l1-tests-macos:
    # Hosted macOS capacity is the one resource this workflow cannot rely on: a
    # job can sit unacquired for fifteen minutes and then fail without running a
    # single test. Keeping it out of the pull-request path means a merge never
    # waits on it, and it still runs every week and on demand — where a release
    # candidate dispatches it and records the result. See docs/releasing.md.
    name: L1 tests (macos-15)
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_l1_macos == true) }}
    # Pinned, not `latest`. `macos-latest` moved to macOS 26 in June 2026, and the
    # newest image is the smallest and most contended pool: a job can wait fifteen
    # minutes and then be cancelled without ever running. What this job validates
    # is the BSD userland and how paths resolve on macOS, not a particular version,
    # so an established image gives the same signal and does not change under us on
    # the next migration. Revisit when macOS 15 approaches retirement.
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # No job here pushes, so the token does not need to survive the
          # checkout in the local git config.
          persist-credentials: false

      - name: Ensure scripts are executable
        run: |
          chmod +x bin/pandoc-pdf
          chmod +x tests/run.sh
          chmod +x scripts/runtime/validate-config.py
          chmod +x scripts/runtime/render-native.py
          chmod +x scripts/runtime/prepare-emojis.py
          chmod +x scripts/runtime/preflight.sh
          chmod +x scripts/runtime/preflight.py

      - name: Run L1 CLI test suite
        run: tests/run.sh

  l2-render-integration:
    name: L2 render integration (ubuntu, optional)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_render_integration == true }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # No job here pushes, so the token does not need to survive the
          # checkout in the local git config.
          persist-credentials: false

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc texlive-latex-base texlive-latex-extra \
            texlive-fonts-recommended librsvg2-bin
          # Check every declared template style, not only the last missing file.
          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path
          template = Path("templates/default.tex").read_text()
          packages = re.findall(
              r"\\usepackage(?:\[[^]]*\])?{([^}]+)}", template
          )
          for group in packages:
              for package in group.split(","):
                  subprocess.run(["kpsewhich", package + ".sty"], check=True)
          PY

      - name: Ensure scripts are executable
        run: |
          chmod +x bin/pandoc-pdf
          chmod +x scripts/runtime/validate-config.py
          chmod +x scripts/runtime/render-native.py
          chmod +x scripts/runtime/prepare-emojis.py
          chmod +x scripts/runtime/preflight.sh
          chmod +x scripts/runtime/preflight.py
          chmod +x tests/l2-local.sh

      - name: Run L2 local integration runner
        run: |
          bash tests/l2-local.sh

  l3-render-full:
    name: L3 full integration (ubuntu, scheduled/manual)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_render_full == true) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # No job here pushes, so the token does not need to survive the
          # checkout in the local git config.
          persist-credentials: false

      - name: Install full runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc texlive-latex-base texlive-latex-extra \
            texlive-fonts-recommended librsvg2-bin texlive-xetex nodejs npm
          # Check every declared template style, not only the last missing file.
          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path
          template = Path("templates/default.tex").read_text()
          packages = re.findall(
              r"\\usepackage(?:\[[^]]*\])?{([^}]+)}", template
          )
          for group in packages:
              for package in group.split(","):
                  subprocess.run(["kpsewhich", package + ".sty"], check=True)
          PY
          # Keep in sync with MERMAID_CLI_VERSION and docs/dependency-policy.md
          sudo npm install -g @mermaid-js/mermaid-cli@10.9.1

      - name: Ensure scripts are executable
        run: |
          chmod +x bin/pandoc-pdf
          chmod +x scripts/runtime/validate-config.py
          chmod +x scripts/runtime/render-native.py
          chmod +x scripts/runtime/prepare-emojis.py
          chmod +x scripts/runtime/preflight.sh
          chmod +x scripts/runtime/preflight.py
          chmod +x tests/l3-local.sh

      - name: Run L3 local integration runner
        run: |
          # Use the hosted image's Chrome, not a confined Chromium Snap.
          chrome_path="$(command -v google-chrome)"
          test -x "$chrome_path"
          test -r "$(npm root -g)/@mermaid-js/mermaid-cli/dist/index.html"
          PUPPETEER_EXECUTABLE_PATH="$chrome_path" bash tests/l3-local.sh

  epub-acceptance:
    name: EPUB acceptance (ubuntu, manual)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_epub_acceptance == true }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # No job here pushes, so the token does not need to survive the
          # checkout in the local git config.
          persist-credentials: false

      - name: Install publication dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc nodejs npm
          # Keep in sync with MERMAID_CLI_VERSION and docs/dependency-policy.md
          sudo npm install -g @mermaid-js/mermaid-cli@10.9.1

      - name: Render the shipped examples
        run: |
          # The hosted image's Chrome, not a confined Chromium Snap; both the L3
          # job and this one rely on what the image already provides.
          chrome_path="$(command -v google-chrome)"
          test -x "$chrome_path"
          # This job validates EPUB publications and carries no LaTeX, so the
          # runner is narrowed to the format validated here. The PDF path is
          # covered by L1 and by the L2/L3 jobs, which install a TeX toolchain.
          PUPPETEER_EXECUTABLE_PATH="$chrome_path" \
            FORMATS=epub bash examples/toPDF.sh

      - name: Install the pinned EPUBCheck
        # Acceptance only. A consumer producing a publication never needs a JVM,
        # which is why this lives here and not in runtime.required_commands.
        # Keep the version in sync with docs/dependency-policy.md.
        run: |
          curl -fsSL -o epubcheck.zip \
            https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          unzip -q epubcheck.zip
          java -version

      - name: Validate every publication
        run: |
          # Errors fail the run; warnings are reported and shown in the log.
          status=0
          for publication in examples/.output/*/*.epub; do
            echo "::group::$(basename "$publication")"
            java -jar epubcheck-5.4.0/epubcheck.jar "$publication" --locale en || status=1
            echo "::endgroup::"
          done
          exit "$status"
