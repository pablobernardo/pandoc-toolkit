name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.2.3)"
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve release tag
        id: vars
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release artifacts
        run: scripts/package-release.sh dist

      - name: Create or update release with assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          files: |
            dist/pandoc-pdf_darwin_amd64.tar.gz
            dist/pandoc-pdf_darwin_arm64.tar.gz
            dist/pandoc-pdf_linux_amd64.tar.gz
            dist/pandoc-pdf_linux_arm64.tar.gz
            dist/checksums.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
