pandoc:
  pdf_engine: xelatex
  toc: true
  toc_depth: 2
  number_sections: true
  template: templates/default.tex
  metadata_file: ""
  resource_path:
    - chapters

filters:
  emoji:
    enabled: true
    emoji_dir: output/emoji
    include_ballot_icons: true
  mermaid:
    enabled: true
    output_dir: output/mermaid
    background: transparent
  extra_lua_filters: []

runtime:
  required_commands:
    - pandoc
    - python3
    - curl
    - mmdc
  strict: true

compat:
  legacy_clearpage_between_h1: true
