version: 1

project:
  name: sample-project
  base_dir: .

document:
  title: "Project Technical Documentation"
  subtitle: "Compliance and Operations"
  publisher: "ACME Corp"
  author: "Engineering Team"
  date: "2026-04-21"
  rights: "Internal Use"

input:
  chapters_dir: "chapters"
  glob: "*.md"
  order: natural
  explicit_files: []

output:
  dir: "output"
  file_prefix: "report"
  suffix: "${date:YYYYMMDD}"
  keep_merged_markdown: true

pandoc:
  pdf_engine: xelatex
  toc: true
  toc_depth: 2
  number_sections: true
  template: "templates/default.tex"
  metadata_file: "metadata.yaml"
  resource_path:
    - "chapters"
    - "chapters/media"
    - "output/emoji"

filters:
  emoji:
    enabled: true
    emoji_dir: "output/emoji"
    include_ballot_icons: true
  mermaid:
    enabled: true
    output_dir: "output/mermaid"
    background: transparent
  extra_lua_filters: []

runtime:
  required_commands:
    - pandoc
    - python3
    - curl
    - mmdc
  strict: true

compat:
  legacy_clearpage_between_h1: true
