version: 1

project:
  name: sample-project
  base_dir: "."

document:
  title: "Project Technical Documentation"
  subtitle: "Compliance and Operations"
  publisher: "ACME Corp"
  author: "Engineering Team"
  date: "2026-04-21"
  rights: "Internal Use"
  language: "en"
  # The smallest example also shows the cover switch: no title page, the
  # document opens on the table of contents.
  titlepage: false
  # Arbitrary Pandoc metadata no longer needs a side file.
  metadata:
    keywords: "compliance, operations"
    subject: "Quarterly report"

input:
  chapters_dir: "chapters"
  glob: "*.md"
  order: natural
  explicit_files: []

output:
  formats: [epub]
  dir: "../.output/test"
  suffix: "${date:YYYYMMDD}"
  keep_merged_markdown: true

pandoc:
  pdf_engine: xelatex
  toc: true
  toc_depth: 2
  number_sections: true
  resource_path:
    - "chapters"

filters:
  emoji:
    enabled: true
    emoji_dir: "../.output/emoji"
    include_ballot_icons: true
  mermaid:
    enabled: true
    output_dir: "../.output/mermaid"
    background: "transparent"
  extra_lua_filters: []

runtime:
  required_commands:
    - pandoc
    - xelatex
    - python3
    - curl
    - mmdc
  strict: true

compat:
  legacy_clearpage_between_h1: true
