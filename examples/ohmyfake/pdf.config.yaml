version: 1

project:
  name: ohmyfake
  base_dir: "."

# Everything the cover needs lives here: no side metadata file.
document:
  title: "Oh My Fake"
  subtitle: "A Field Guide to Convincing Nonsense"
  author: "The Example Maintainers"
  publisher: "Public Domain Press"
  date: "2026"
  # Original text and diagrams, no third-party material.
  rights: "CC0 1.0 Universal — public domain dedication"
  language: "en"
  titlepage: true

input:
  chapters_dir: "chapters"
  glob: "*.md"
  order: natural
  explicit_files: []

output:
  formats: [epub]
  # No file_prefix: the name is a slug of document.title, "oh-my-fake-latest.pdf".
  dir: "../.output/ohmyfake"
  suffix: "latest"
  keep_merged_markdown: true

pandoc:
  pdf_engine: xelatex
  toc: true
  toc_depth: 2
  number_sections: true
  resource_path:
    - "chapters"
    - "."

filters:
  emoji:
    enabled: true
    emoji_dir: "../.output/emoji"
    include_ballot_icons: true
  mermaid:
    enabled: true
    output_dir: "../.output/mermaid"
    background: "transparent"
  extra_lua_filters: []

runtime:
  required_commands:
    - pandoc
    - xelatex
    - python3
    - curl
    - mmdc
  strict: true

compat:
  legacy_clearpage_between_h1: true
