version: 1

project:
  name: lighthouse-keeper-book
  base_dir: "."

document:
  title: "The Lighthouse Keeper"
  subtitle: "A small book in three chapters"
  author: "The Example Maintainers"
  publisher: "Example Editions"
  date: "2026"
  rights: "CC0 1.0 Universal - public domain dedication"
  language: "en"
  titlepage: true
  metadata:
    subject: >-
      A proof-of-concept book laid out with the pandoc-pdf toolkit: front
      matter, numbered chapters and lettered appendices.

input:
  chapters_dir: "content"
  glob: "*.md"
  order: natural
  explicit_files:
    - "front/00-dedication.md"
    - "front/01-characters.md"
    - "chapters/01-the-harbour.md"
    - "chapters/02-the-light.md"
    - "chapters/03-the-storm.md"
    - "back/01-glossary.md"
    - "back/02-about-the-author.md"

output:
  formats: [pdf]
  dir: "../.output/book"
  file_prefix: "the-lighthouse-keeper"
  suffix: "${date:YYYYMMDD}"
  keep_merged_markdown: false

pandoc:
  pdf_engine: xelatex
  toc: true
  toc_depth: 2
  number_sections: true
  template: "templates/book.tex"
  resource_path:
    - "content"

filters:
  emoji:
    enabled: false
  mermaid:
    enabled: false
  extra_lua_filters: []

runtime:
  required_commands:
    - pandoc
    - xelatex
    - python3
  strict: true
