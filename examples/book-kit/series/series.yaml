# examples/book-kit/series/series.yaml
#
# Shared facts for a multi-volume series. The `volumes` list is ordered and
# names the volume directories; each of those directories has its own
# manifest.yaml, which may override any of the shared fields here.

collection: "Twin Lanterns Cycle"
author: "The Example Maintainers"
publisher: "Example Editions"
rights: "CC0 1.0 Universal - public domain dedication"
language: "en"

volumes:
  - volume-1
  - volume-2
