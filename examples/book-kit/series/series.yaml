# examples/book-kit/series/series.yaml
#
# Shared facts for a multi-volume series, validated by the shipped bookkit
# tool against scripts/tools/bookkit/series.schema.json. The `volumes` list
# is ordered and names the volume directories; each of those directories has
# its own manifest.yaml (contract version 1, profile book), which may
# override any of the shared fields here.

manifest_version: 1

collection: "Twin Lanterns Cycle"
author: "The Example Maintainers"
publisher: "Example Editions"
rights: "CC0 1.0 Universal - public domain dedication"
language: "en"

volumes:
  - volume-1
  - volume-2

# Shared by both volumes: the contents separate the front matter, the
# chapters and the appendices into blocks instead of running them together.
toc_separators: space
