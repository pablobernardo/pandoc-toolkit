# examples/book-kit/series/volume-1/manifest.yaml
#
# First volume of the series, contract version 1, profile book. author,
# publisher, rights and language are inherited from ../series.yaml. Paths
# are relative to THIS directory.
#
# The review-request page in back_matter is a real file that the tool
# excludes from the PDF (print: false): it ships with the book project but
# is not part of the printed volume.

manifest_version: 1
profile: book

title: "Twin Lanterns, Volume 1: The North Tower"
subtitle: "The first volume of the Twin Lanterns cycle"
isbn: "978-0-000000-00-0"
date: "2026"

front_matter:
  dedication:
    file: "front-matter/00-dedication.md"
    toc: false
  the-two-lights: "front-matter/01-the-two-lights.md"

chapters:
  - "chapters/01-the-north-road.md"
  - "chapters/02-the-tower.md"
  - "chapters/03-the-keeper.md"

back_matter:
  glossary: "back-matter/01-glossary.md"
  review-request:
    file: "back-matter/02-review-request.md"
    print: false
