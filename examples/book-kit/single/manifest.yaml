# examples/book-kit/single/manifest.yaml
#
# A single-volume project: there is no series.yaml, so this directory is
# itself the volume and this manifest carries every field, with no series
# defaults to merge. Paths are relative to THIS directory (the volume
# directory), and every listed printable file must exist.
#
# The manifest is validated by the shipped bookkit tool against
# scripts/tools/bookkit/manifest.schema.json: manifest_version and profile
# name the contract, and the folder layout below is a convention the tool
# does not enforce.

manifest_version: 1
profile: book

title: "A Field Guide to Imaginary Weather"
subtitle: "Three short chapters on weather that does not exist"
author: "The Example Maintainers"
publisher: "Example Editions"
rights: "CC0 1.0 Universal - public domain dedication"
language: "en"
date: "2026"
collection: "Imaginary Field Guides"
isbn: "978-0-000000-01-8"
audience: "Curious readers of impossible weather"

front_matter:
  note: "front-matter/00-note.md"

chapters:
  - "chapters/01-clouds.md"
  - "chapters/02-fog.md"
  - "chapters/03-rain.md"

back_matter:
  glossary: "back-matter/01-glossary.md"
  about: "back-matter/02-about-this-guide.md"
